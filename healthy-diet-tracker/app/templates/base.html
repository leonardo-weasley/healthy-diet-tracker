<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="健康饮食记录：上传餐食照片，确认食物与重量，追踪每日营养摄入。">
  <title>{% block title %}健康饮食记录{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="健康饮食记录首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21c4.2 0 7.5-3.2 7.5-7.2 0-4.2-2.9-7.1-5.6-8.8C11.5 3.6 9 2.4 6.5 3c.2 2.6 1.3 5 3.2 6.7"></path>
            <path d="M12 21c-4.2 0-7.5-3.2-7.5-7.2 0-1.6.4-3 1.2-4.2"></path>
            <path d="M12 21c0-4.5 1.5-8.2 4.5-10.5"></path>
          </svg>
        </span>
        <span class="brand-text">
          <strong>健康饮食记录</strong>
          <small>拍一张，记一餐</small>
        </span>
      </a>

      <nav class="site-nav" aria-label="主导航">
        <a href="/" class="nav-link{% if request.path == '/' %} is-active{% endif %}"{% if request.path == '/' %} aria-current="page"{% endif %}>今日概览</a>
        <a href="/upload" class="nav-link{% if request.path == '/upload' %} is-active{% endif %}"{% if request.path == '/upload' %} aria-current="page"{% endif %}>上传餐食</a>
        <a href="/history" class="nav-link{% if request.path == '/history' %} is-active{% endif %}"{% if request.path == '/history' %} aria-current="page"{% endif %}>历史记录</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="shell page {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>营养数据为估算值，仅供参考，不能替代专业医疗或营养建议。</p>
      <p class="footer-meta">Healthy Diet Tracker · 数据仅保存在本机</p>
    </div>
  </footer>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="{{ url_for('static', filename='js/api.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
